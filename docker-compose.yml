version: '3.8'

services:
  # BankGuard FastAPI Scoring Microservice
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankguard-api
    command: [ "api" ]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # BankGuard Berry FinTech Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankguard-dashboard
    command: [ "dashboard" ]
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
